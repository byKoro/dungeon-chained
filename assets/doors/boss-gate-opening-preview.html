<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porta do boss — abertura</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17121e; color: #ead8c9; font: 16px system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 24px; }
    canvas { display: block; margin: 20px auto; width: min(384px, 85vw); height: auto; image-rendering: pixelated; background: #241c2c; border-radius: 8px; }
    button { padding: 12px 24px; border: 1px solid #a57852; border-radius: 6px; background: #503548; color: #fff2dc; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    p { color: #baa4b8; max-width: 420px; }
</style>
<main>
    <h1>Porta do boss</h1>
    <canvas width="384" height="384" aria-label="Animação de abertura da grade da porta do boss"></canvas>
    <button disabled>Repetir abertura</button>
    <p>Prévia em quatro quadros. A grade sobe e revela a passagem.</p>
</main>
<script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const button = document.querySelector('button');
    const sheet = new Image();
    let animationId;
    ctx.imageSmoothingEnabled = false;
    function drawFrame(frame) {
        const width = sheet.naturalWidth / 2;
        const height = sheet.naturalHeight / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(sheet, (frame % 2) * width, Math.floor(frame / 2) * height,
            width, height, 0, 0, canvas.width, canvas.height);
    }
    function play() {
        cancelAnimationFrame(animationId);
        const started = performance.now();
        function tick(now) {
            const elapsed = now - started;
            const frame = elapsed < 650 ? 0 : elapsed < 850 ? 1 : elapsed < 1050 ? 2 : 3;
            drawFrame(frame);
            if (frame < 3) animationId = requestAnimationFrame(tick);
        }
        animationId = requestAnimationFrame(tick);
    }
    sheet.onload = () => { button.disabled = false; play(); };
    sheet.onerror = () => { document.querySelector('p').textContent = 'Não foi possível carregar os quadros. Mantenha este HTML junto do PNG.'; };
    button.addEventListener('click', play);
    sheet.src = 'boss-gate-opening-sheet-v1.png';
</script>
</html>
