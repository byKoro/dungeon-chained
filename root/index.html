<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chained Roguelike 2D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0e17;
            color: #fffffe;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #ui-bar {
            width: 1280px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1d2b;
            padding: 10px 20px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border: 2px solid #332f4c;
            border-bottom: none;
        }

        .hud-item {
            font-size: 16px;
            font-weight: bold;
        }

        .btn {
            background: #e53170;
            color: #fff;
            border: 2px solid #a81c4e;
            padding: 6px 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.1s transform, 0.1s background;
        }

        .btn:hover {
            background: #ff4b8b;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #gameCanvas {
            background-color: #1a1824;
            border: 3px solid #332f4c;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 95vw;
            max-height: calc(95vw * (9 / 16));
        }

        #instructions {
            margin-top: 8px;
            font-size: 13px;
            color: #a7a9be;
        }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div class="hud-item" id="hud-floor">CALABOUÇO: ANDAR 1</div>
        <div class="hud-item" id="hud-p1" style="color: #4fc3f7;">P1: ❤️❤️❤️</div>
        <div class="hud-item" id="hud-p2" style="color: #ffb74d;">P2: ❤️❤️❤️</div>
        <div>
            <button class="btn" id="btn-weapon">ARMA: LASER</button>
            <button class="btn" id="btn-restart" style="background:#ff8906; border-color:#c26400;">REINICIAR</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="instructions">
        [P1 (Azul)]: WASD | [P2 (Laranja)]: SETAS | Encoste o vínculo nos monstros | Desça no Alçapão ao limpar a sala!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // UI
        const hudFloor = document.getElementById("hud-floor");
        const hudP1 = document.getElementById("hud-p1");
        const hudP2 = document.getElementById("hud-p2");
        const btnWeapon = document.getElementById("btn-weapon");
        const btnRestart = document.getElementById("btn-restart");

        // Estado do Jogo
        let floor = 1;
        let gameOver = false;
        let currentWeapon = "laser"; // 'laser' ou 'saw'
        let sawRotationAngle = 0;

        // Teclado
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

        // Configuração de Jogador
        class Player {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.color = color;
                this.controls = controls; // ['up', 'down', 'left', 'right']
                this.vx = 0;
                this.vy = 0;
                this.speed = 4.2;
                this.lives = 3;
                this.invulnerableTimer = 0;
            }

            update() {
                if (this.invulnerableTimer > 0) this.invulnerableTimer--;

                let moveX = 0;
                let moveY = 0;
                if (keys[this.controls[0]]) moveY -= 1;
                if (keys[this.controls[1]]) moveY += 1;
                if (keys[this.controls[2]]) moveX -= 1;
                if (keys[this.controls[3]]) moveX += 1;

                if (moveX !== 0 && moveY !== 0) {
                    moveX *= 0.7071;
                    moveY *= 0.7071;
                }

                // Inércia leve para sensação natural
                this.vx = this.vx * 0.75 + moveX * this.speed * 0.25;
                this.vy = this.vy * 0.75 + moveY * this.speed * 0.25;

                this.x += this.vx;
                this.y += this.vy;

                // Colisão Bordas (Calabouço)
                const wallOffset = 40;
                if (this.x - this.radius < wallOffset) this.x = wallOffset + this.radius;
                if (this.x + this.radius > canvas.width - wallOffset) this.x = canvas.width - wallOffset - this.radius;
                if (this.y - this.radius < wallOffset) this.y = wallOffset + this.radius;
                if (this.y + this.radius > canvas.height - wallOffset) this.y = canvas.height - wallOffset - this.radius;
            }

            draw() {
                ctx.save();
                if (this.invulnerableTimer % 6 >= 3) {
                    ctx.globalAlpha = 0.3; // Efeito de piscar ao levar dano
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#fff";
                ctx.stroke();

                // Detalhe de Olhos no player
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 4, 3, 0, Math.PI * 2);
                ctx.arc(this.x + 5, this.y - 4, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Inimigos
        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 36;
                this.maxHp = 60 + floor * 15;
                this.hp = this.maxHp;
                this.speed = 1.6 + Math.min(1.5, floor * 0.15);
                this.vx = 0;
                this.vy = 0;
                this.hitCooldown = 0;
            }

            update(p1, p2) {
                if (this.hitCooldown > 0) this.hitCooldown--;

                // Persegue o mais próximo
                const d1 = Math.hypot(p1.x - this.x, p1.y - this.y);
                const d2 = Math.hypot(p2.x - this.x, p2.y - this.y);
                const target = d1 < d2 ? p1 : p2;

                const angle = Math.atan2(target.y - this.y, target.x - this.x);
                this.vx = this.vx * 0.85 + Math.cos(angle) * this.speed * 0.15;
                this.vy = this.vy * 0.85 + Math.sin(angle) * this.speed * 0.15;

                this.x += this.vx;
                this.y += this.vy;

                // Ataque aos Players
                [p1, p2].forEach(p => {
                    const dist = Math.hypot(p.x - this.x, p.y - this.y);
                    if (dist < p.radius + this.size / 2) {
                        if (p.invulnerableTimer === 0) {
                            p.lives--;
                            p.invulnerableTimer = 60; // 1s de invulnerabilidade
                            // Empurrão no player
                            const pushAngle = Math.atan2(p.y - this.y, p.x - this.x);
                            p.vx += Math.cos(pushAngle) * 14;
                            p.vy += Math.sin(pushAngle) * 14;
                        }
                    }
                });
            }

            draw() {
                const half = this.size / 2;
                ctx.fillStyle = "#e53170";
                ctx.fillRect(this.x - half, this.y - half, this.size, this.size);
                ctx.strokeStyle = "#ff8906";
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - half, this.y - half, this.size, this.size);

                // Rostinho malvado
                ctx.fillStyle = "#000";
                ctx.fillRect(this.x - 10, this.y - 6, 6, 6);
                ctx.fillRect(this.x + 4, this.y - 6, 6, 6);
                ctx.fillRect(this.x - 8, this.y + 6, 16, 3);

                // Healthbar
                const barWidth = 36;
                const barHeight = 5;
                const hpPercent = Math.max(0, this.hp / this.maxHp);
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(this.x - barWidth / 2, this.y - half - 10, barWidth, barHeight);
                ctx.fillStyle = "#00ebc7";
                ctx.fillRect(this.x - barWidth / 2, this.y - half - 10, barWidth * hpPercent, barHeight);
            }
        }

        // Instâncias
        let p1, p2;
        let enemies = [];
        let boxes = [];
        let trapdoor = { x: 0, y: 0, size: 50, open: false };

        function initLevel(resetAll = false) {
            if (resetAll) {
                floor = 1;
                p1 = new Player(300, 360, "#4fc3f7", ["w", "s", "a", "d"]);
                p2 = new Player(380, 360, "#ffb74d", ["arrowup", "arrowdown", "arrowleft", "arrowright"]);
            } else {
                p1.x = 200; p1.y = 360; p1.vx = 0; p1.vy = 0;
                p2.x = 260; p2.y = 360; p2.vx = 0; p2.vy = 0;
            }
            gameOver = false;

            // Gerar Caixas
            boxes = [];
            const boxCount = 4 + Math.floor(Math.random() * 4);
            for (let i = 0; i < boxCount; i++) {
                boxes.push({
                    x: 350 + Math.random() * 550,
                    y: 100 + Math.random() * 480,
                    w: 50 + Math.random() * 30,
                    h: 50 + Math.random() * 30
                });
            }

            // Gerar Inimigos
            enemies = [];
            const count = 3 + floor * 2;
            for (let i = 0; i < count; i++) {
                enemies.push(new Enemy(
                    700 + Math.random() * 450,
                    100 + Math.random() * 500
                ));
            }

            // Alçapão no centro/direita
            trapdoor.x = 1120;
            trapdoor.y = 360;
            trapdoor.open = false;

            updateHud();
        }

        // Física Elástica da Corrente
        function updateChainPhysics() {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);

            const maxRestDistance = 180; // Comprimento natural
            if (dist > maxRestDistance) {
                const diff = dist - maxRestDistance;
                const force = diff * 0.035; // Constante elástica k
                const fx = (dx / dist) * force;
                const fy = (dy / dist) * force;

                p1.vx += fx;
                p1.vy += fy;
                p2.vx -= fx;
                p2.vy -= fy;
            }
        }

        // Colisões de Caixas com Círculos
        function resolveBoxCollisions(entity) {
            boxes.forEach(b => {
                const nearestX = Math.max(b.x, Math.min(entity.x, b.x + b.w));
                const nearestY = Math.max(b.y, Math.min(entity.y, b.y + b.h));
                const distX = entity.x - nearestX;
                const distY = entity.y - nearestY;
                const dist = Math.hypot(distX, distY);
                const r = entity.radius || (entity.size ? entity.size / 2 : 15);

                if (dist < r) {
                    const overlap = r - dist;
                    if (dist === 0) {
                        entity.x += overlap;
                    } else {
                        entity.x += (distX / dist) * overlap;
                        entity.y += (distY / dist) * overlap;
                    }
                }
            });
        }

        // Distância ponto-linha para detecção da corrente com o inimigo
        function distToSegment(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
        }

        // Lógica de dano das armas na corrente
        function handleWeaponInteraction() {
            sawRotationAngle += 0.15;

            enemies.forEach(enemy => {
                const d = distToSegment(enemy.x, enemy.y, p1.x, p1.y, p2.x, p2.y);
                const hitThreshold = currentWeapon === "laser" ? 18 : 26;

                if (d < hitThreshold + enemy.size / 2) {
                    if (currentWeapon === "laser") {
                        // Laser: Dano constante e sustentado, sem knockback
                        enemy.hp -= 1.3;
                    } else if (currentWeapon === "saw") {
                        // Serras: Dano por acerto com recuo forte
                        if (enemy.hitCooldown === 0) {
                            enemy.hp -= 22;
                            enemy.hitCooldown = 15;

                            // Empurrão perpendicular à linha
                            const nx = -(p2.y - p1.y);
                            const ny = (p2.x - p1.x);
                            const len = Math.hypot(nx, ny) || 1;
                            const sign = ((enemy.x - p1.x) * (p2.y - p1.y) - (enemy.y - p1.y) * (p2.x - p1.x) > 0) ? -1 : 1;

                            enemy.vx += (nx / len) * 12 * sign;
                            enemy.vy += (ny / len) * 12 * sign;
                        }
                    }
                }
            });

            // Remove inimigos mortos
            enemies = enemies.filter(e => e.hp > 0);
            if (enemies.length === 0) {
                trapdoor.open = true;
            }
        }

        // Desenhar Armas
        function drawWeapon() {
            if (currentWeapon === "laser") {
                // Feixe Laser
                ctx.save();
                ctx.lineWidth = 10;
                ctx.strokeStyle = "rgba(0, 235, 199, 0.3)";
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

                ctx.lineWidth = 4;
                ctx.strokeStyle = "#00ebc7";
                ctx.shadowColor = "#00ebc7";
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                ctx.restore();
            } else if (currentWeapon === "saw") {
                // Corrente de Serras
                const numSaws = 5;
                ctx.save();
                ctx.strokeStyle = "#a7a9be";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

                for (let i = 1; i <= numSaws; i++) {
                    const t = i / (numSaws + 1);
                    const sx = p1.x + (p2.x - p1.x) * t;
                    const sy = p1.y + (p2.y - p1.y) * t;
                    const radius = (i % 2 === 0) ? 14 : 10;

                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(sawRotationAngle * (i % 2 === 0 ? 1 : -1));

                    // Desenho da serra dentada
                    ctx.fillStyle = "#ff5470";
                    ctx.beginPath();
                    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                        ctx.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
                        ctx.lineTo(Math.cos(a + 0.3) * (radius * 0.5), Math.sin(a + 0.3) * (radius * 0.5));
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.restore();
                }
                ctx.restore();
            }
        }

        // Desenho de Cenário
        function drawDungeon() {
            // Chão quadriculado
            ctx.fillStyle = "#16151f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1f1d2b";
            ctx.lineWidth = 2;
            for (let x = 40; x < canvas.width - 40; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 40);
                ctx.lineTo(x, canvas.height - 40);
                ctx.stroke();
            }
            for (let y = 40; y < canvas.height - 40; y += 40) {
                ctx.beginPath();
                ctx.moveTo(40, y);
                ctx.lineTo(canvas.width - 40, y);
                ctx.stroke();
            }

            // Paredes Externas
            ctx.fillStyle = "#09080e";
            ctx.fillRect(0, 0, canvas.width, 40);
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillRect(0, 0, 40, canvas.height);
            ctx.fillRect(canvas.width - 40, 0, 40, canvas.height);

            // Caixas
            boxes.forEach(b => {
                ctx.fillStyle = "#5c4d3c";
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = "#382e24";
                ctx.lineWidth = 3;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x + b.w, b.y + b.h);
                ctx.moveTo(b.x + b.w, b.y);
                ctx.lineTo(b.x, b.y + b.h);
                ctx.stroke();
            });

            // Alçapão
            ctx.save();
            ctx.translate(trapdoor.x, trapdoor.y);
            ctx.fillStyle = trapdoor.open ? "#000" : "#2e2118";
            ctx.fillRect(-trapdoor.size / 2, -trapdoor.size / 2, trapdoor.size, trapdoor.size);
            ctx.strokeStyle = trapdoor.open ? "#00ebc7" : "#553b2a";
            ctx.lineWidth = 3;
            ctx.strokeRect(-trapdoor.size / 2, -trapdoor.size / 2, trapdoor.size, trapdoor.size);

            if (!trapdoor.open) {
                ctx.fillStyle = "#fffffe";
                ctx.font = "bold 10px monospace";
                ctx.fillText("TRANCA", -18, 4);
            } else {
                ctx.fillStyle = "#00ebc7";
                ctx.font = "bold 11px monospace";
                ctx.fillText("DESÇA", -16, 4);
            }
            ctx.restore();
        }

        function updateHud() {
            hudFloor.innerText = `CALABOUÇO: ANDAR ${floor}`;
            hudP1.innerText = `P1: ${"❤️".repeat(Math.max(0, p1.lives))}`;
            hudP2.innerText = `P2: ${"❤️".repeat(Math.max(0, p2.lives))}`;
        }

        // Loop Principal
        function gameLoop() {
            if (!gameOver) {
                // Atualizações
                p1.update();
                p2.update();

                updateChainPhysics();

                resolveBoxCollisions(p1);
                resolveBoxCollisions(p2);

                enemies.forEach(e => {
                    e.update(p1, p2);
                    resolveBoxCollisions(e);
                });

                handleWeaponInteraction();

                // Checar Derrota
                if (p1.lives <= 0 || p2.lives <= 0) {
                    gameOver = true;
                }

                // Checar Avanço pelo Alçapão
                if (trapdoor.open) {
                    const d1 = Math.hypot(p1.x - trapdoor.x, p1.y - trapdoor.y);
                    const d2 = Math.hypot(p2.x - trapdoor.x, p2.y - trapdoor.y);
                    if (d1 < 30 && d2 < 30) {
                        floor++;
                        initLevel(false);
                    }
                }

                updateHud();
            }

            // Renderização
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawDungeon();
            drawWeapon();
            p1.draw();
            p2.draw();
            enemies.forEach(e => e.draw());

            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e53170";
                ctx.font = "bold 42px monospace";
                ctx.textAlign = "center";
                ctx.fillText("VOCÊS FORAM DERROTADOS!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#fffffe";
                ctx.font = "20px monospace";
                ctx.fillText(`Chegaram até o Andar ${floor}`, canvas.width / 2, canvas.height / 2 + 25);
                ctx.fillText("Clique em 'REINICIAR' para jogar novamente", canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = "start";
            }

            requestAnimationFrame(gameLoop);
        }

        // Eventos de Botões
        btnWeapon.addEventListener("click", () => {
            if (currentWeapon === "laser") {
                currentWeapon = "saw";
                btnWeapon.innerText = "ARMA: SERRAS";
                btnWeapon.style.background = "#ff5470";
            } else {
                currentWeapon = "laser";
                btnWeapon.innerText = "ARMA: LASER";
                btnWeapon.style.background = "#e53170";
            }
        });

        btnRestart.addEventListener("click", () => {
            initLevel(true);
        });

        // Inicializar
        initLevel(true);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
