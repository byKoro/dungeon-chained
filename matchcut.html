<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Chained — Match cuts (prévia)</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #05040a;
            overflow: hidden;
            font-family: monospace;
        }
        /* Canvas fixo em 1920x1080 (igual ao vídeo), ajustado à janela. */
        #matchCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #mc-ui {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            opacity: 0.85;
        }
        .t-btn {
            cursor: pointer;
            border: 2px solid #5a37c7;
            background: #7f5af0;
            color: #fffffe;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 6px;
        }
        .t-btn[aria-pressed="true"] {
            background: #2cb67d;
            border-color: #1e8a5e;
        }
    </style>
</head>
<body>
    <canvas id="matchCanvas" aria-label="Prévia do clipe de match cut"></canvas>

    <div id="mc-ui" role="toolbar" aria-label="Controles da prévia">
        <span id="mc-shots" style="display:flex;gap:8px"></span>
        <button class="t-btn" id="btn-replay" type="button">↻ REPETIR</button>
        <button class="t-btn" id="btn-loop" type="button" aria-pressed="true">LOOP</button>
    </div>

    <script type="module" src="js/matchcut.js"></script>
</body>
</html>
