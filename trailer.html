<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Chained — Trailer (Gameplay Simulator)</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #05040a;
            overflow: hidden;
            font-family: monospace;
        }
        #trailerCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* Botão de reiniciar/avançar a cena do trailer. */
        #trailer-ui {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            opacity: 0.85;
        }
        .t-btn {
            cursor: pointer;
            border: 2px solid #5a37c7;
            background: #7f5af0;
            color: #fffffe;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 6px;
        }
        .t-btn.secondary {
            background: #2cb67d;
            border-color: #1e8a5e;
        }
    </style>
</head>
<body>
    <canvas id="trailerCanvas"></canvas>


    <div id="trailer-ui">
        <button class="t-btn" id="btn-replay">↻ REPLAY SCENE</button>
        <a href="index.html?skipTrailer" class="t-btn secondary" style="text-decoration:none;">▶ PLAY</a>
    </div>

    <script type="module" src="js/trailer.js"></script>
</body>
</html>
