<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Chained</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Tela de morte (js/ui/DeathScreen.js): só o botão RESTART em pixel art. -->
    <div id="death-screen" aria-hidden="true">
        <button class="pixel-btn death-btn" type="button"><canvas></canvas></button>
    </div>

    <!-- Tela de pausa do jogo (js/ui/PauseScreen.js): RESUME / RESTART / VOLUME
         em pixel art (os controles são montados pelo JS). O trailer cria a
         sua (#trailer-pause: RESUME / VOLUME). -->
    <div id="pause-screen" class="pause-screen" role="dialog" aria-label="Paused" aria-hidden="true">
        <div class="pause-menu"></div>
    </div>

    <!-- Trailer de abertura (js/ui/TrailerOverlay.js): SKIP (canto) e START (no fim). -->
    <div id="trailer-overlay" class="hidden">
        <button class="tr-skip" id="btn-skip" type="button"><canvas></canvas></button>
        <button class="tr-start" id="btn-start" type="button"><canvas></canvas></button>
    </div>

    <!-- Tela de carregamento (js/ui/LoadingScreen.js). Começa visível para
         cobrir o canvas enquanto os módulos e as texturas carregam. -->
    <div id="loading-screen" role="progressbar" aria-label="Loading…" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas class="ls-bar" aria-hidden="true"></canvas>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
