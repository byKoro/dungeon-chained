<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Chained</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-bar">
        <div class="hud-item" id="hud-floor">CALABOUÇO: ANDAR 1</div>
        <div class="hud-item" id="hud-p1" style="color: #ffd166;">P1 (Amarelo): ❤️❤️❤️</div>
        <div class="hud-item" id="hud-p2" style="color: #6bb4db;">P2 (Azul): ❤️❤️❤️</div>
        <div>
            <button class="btn" id="btn-weapon" style="background:#8d99ae;">ARMA: SERRAS</button>
            <button class="btn" id="btn-tileset" style="background:#2cb67d; border-color:#1e8a5e;">TILESET (T)</button>
            <button class="btn" id="btn-restart" style="background:#ff8906; border-color:#c26400;">REINICIAR</button>
            <a href="editor.html" class="btn" id="btn-editor" style="background:#7f5af0; border-color:#5a37c7; text-decoration:none; display:inline-block;">🛠️ EDITOR</a>
        </div>
    </div>

    <div id="instructions">
        [P1 Amarelo]: WASD | [P2 Azul]: SETAS
    </div>

    <!-- Trailer de abertura: PULAR (canto) e COMEÇAR (no fim). -->
    <div id="trailer-overlay" class="hidden">
        <button class="tr-skip" id="btn-skip" type="button">PULAR ▶</button>
        <button class="tr-start" id="btn-start" type="button">COMEÇAR</button>
    </div>

    <!-- Tela de carregamento (js/ui/LoadingScreen.js). Começa visível para
         cobrir o canvas enquanto os módulos e as texturas carregam. -->
    <div id="loading-screen" role="status" aria-live="polite">
        <div class="ls-box">
            <div class="ls-title">DUNGEON CHAINED</div>
            <div class="ls-label">Carregando…</div>
            <div class="ls-bar" aria-hidden="true"><div class="ls-bar-fill"></div></div>
            <div class="ls-pct">0%</div>
            <div class="ls-tip"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
