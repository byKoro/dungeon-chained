<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dungeon Chained</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Tela de morte (js/ui/DeathScreen.js): só o botão REINICIAR em pixel art. -->
    <div id="death-screen" aria-hidden="true">
        <button class="death-btn" type="button"><canvas></canvas></button>
    </div>
    <!-- Trailer de abertura: PULAR (canto) e COMEÇAR (no fim). -->
    <div id="trailer-overlay" class="hidden">
        <button class="tr-skip" id="btn-skip" type="button">PULAR ▶</button>
        <button class="tr-start" id="btn-start" type="button">COMEÇAR</button>
    </div>

    <!-- Tela de carregamento (js/ui/LoadingScreen.js). Começa visível para
         cobrir o canvas enquanto os módulos e as texturas carregam. -->
    <div id="loading-screen" role="progressbar" aria-label="Carregando…" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas class="ls-bar" aria-hidden="true"></canvas>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
