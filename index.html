<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chained Roguelike 2D - Espalhando Detritos</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0e17;
            color: #fffffe;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #ui-bar {
            width: 1280px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1d2b;
            padding: 10px 20px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border: 2px solid #332f4c;
            border-bottom: none;
        }

        .hud-item {
            font-size: 16px;
            font-weight: bold;
        }

        .btn {
            background: #e53170;
            color: #fff;
            border: 2px solid #a81c4e;
            padding: 6px 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.1s transform, 0.1s background;
        }

        .btn:hover {
            background: #ff4b8b;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #gameCanvas {
            background-color: #1a1824;
            border: 3px solid #332f4c;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 95vw;
            max-height: calc(95vw * (9 / 16));
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #instructions {
            margin-top: 8px;
            font-size: 13px;
            color: #a7a9be;
        }
    </style>
</head>
<body>

    <div id="ui-bar">
        <div class="hud-item" id="hud-floor">CALABOUÇO: ANDAR 1</div>
        <div class="hud-item" id="hud-p1" style="color: #ffd166;">P1 (Amarelo): ❤️❤️❤️</div>
        <div class="hud-item" id="hud-p2" style="color: #6bb4db;">P2 (Azul): ❤️❤️❤️</div>
        <div>
            <button class="btn" id="btn-weapon">ARMA: LASER</button>
            <button class="btn" id="btn-restart" style="background:#ff8906; border-color:#c26400;">REINICIAR</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="instructions">
        [P1 Amarelo]: WASD | [P2 Azul]: SETAS | Ande por cima dos pedaços no chão para chutá-los e espalhá-los!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        // Sprites dos Jogadores
        const imgP1 = new Image();
        imgP1.src = "player_01.png";
        let imgP1Loaded = false;
        imgP1.onload = () => { imgP1Loaded = true; };

        const imgP2 = new Image();
        imgP2.src = "npc_knight_green.png";
        let imgP2Loaded = false;
        imgP2.onload = () => { imgP2Loaded = true; };

        // Spritesheet dos Inimigos
        const enemySheet = new Image();
        enemySheet.src = "Dungeon_Character.png";
        let enemySheetLoaded = false;
        let enemyGridW = 16;
        let enemyGridH = 16;

        enemySheet.onload = () => {
            enemySheetLoaded = true;
            enemyGridW = enemySheet.naturalWidth / 7;
            enemyGridH = enemySheet.naturalHeight / 4;
        };

        // HUD
        const hudFloor = document.getElementById("hud-floor");
        const hudP1 = document.getElementById("hud-p1");
        const hudP2 = document.getElementById("hud-p2");
        const btnWeapon = document.getElementById("btn-weapon");
        const btnRestart = document.getElementById("btn-restart");

        // Estado do Jogo
        let floor = 1;
        let gameOver = false;
        let currentWeapon = "laser";
        let sawRotationAngle = 0;
        let screenShake = 0;

        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

        // Lista dinâmica de detritos e sangue no chão que reagem aos pés dos jogadores
        let floorDebris = [];
        let activeAirParticles = [];

        // Detritos no Chão com Física de Chute / Arrastamento
        class FloorDebris {
            constructor(x, y, w, h, color, isBlood) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.color = color;
                this.isBlood = isBlood;
                this.vx = 0;
                this.vy = 0;
                this.friction = isBlood ? 0.82 : 0.88; // Sangue freia um pouco mais rápido
            }

            update(players) {
                // Interação com o movimento dos jogadores (chutar ao passar por cima)
                players.forEach(p => {
                    const pSpeed = Math.hypot(p.vx, p.vy);
                    if (pSpeed > 0.4) {
                        const dx = this.x - p.x;
                        const dy = this.y - p.y;
                        const dist = Math.hypot(dx, dy);
                        const kickRadius = p.hitRadius + 6;

                        if (dist < kickRadius && dist > 0) {
                            // Direção do chute influenciada pela velocidade do player + dispersão lateral
                            const kickStrength = pSpeed * (this.isBlood ? 0.45 : 0.85);
                            const kickAngle = Math.atan2(p.vy, p.vx) + (Math.random() - 0.5) * 0.9;
                            
                            this.vx += Math.cos(kickAngle) * kickStrength;
                            this.vy += Math.sin(kickAngle) * kickStrength;

                            // Empurrão de afastamento para evitar sobreposição imediata
                            this.x += (dx / dist) * 2;
                            this.y += (dy / dist) * 2;
                        }
                    }
                });

                // Movimento residual no solo
                if (Math.abs(this.vx) > 0.05 || Math.abs(this.vy) > 0.05) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                } else {
                    this.vx = 0;
                    this.vy = 0;
                }

                // Limites com as paredes da arena
                const minX = 140, maxX = canvas.width - 140;
                const minY = 100, maxY = canvas.height - 100;
                if (this.x < minX) { this.x = minX; this.vx = 0; }
                if (this.x > maxX) { this.x = maxX; this.vx = 0; }
                if (this.y < minY) { this.y = minY; this.vy = 0; }
                if (this.y > maxY) { this.y = maxY; this.vy = 0; }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(Math.floor(this.x - this.w / 2), Math.floor(this.y - this.h / 2), this.w, this.h);
            }
        }

        // Partículas no ar antes de caírem no chão
        class AirParticle {
            constructor(x, y, color, isBlood = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.isBlood = isBlood;

                const pixelSizes = isBlood ? [3, 4, 5] : [3, 4, 6];
                this.size = pixelSizes[Math.floor(Math.random() * pixelSizes.length)];

                const angle = Math.random() * Math.PI * 2;
                const speed = (isBlood ? 3 : 4) + Math.random() * (isBlood ? 8 : 11);
                this.vx = Math.cos(angle) * speed + (Math.random() - 0.5) * 2;
                this.vy = Math.sin(angle) * speed - (1 + Math.random() * 3.5);

                this.gravity = 0.4;
                this.friction = 0.92;

                this.groundOffset = (Math.random() - 0.5) * 36;
                this.groundY = y + 12 + this.groundOffset;
                this.bounces = 0;
                this.maxBounces = 1 + Math.floor(Math.random() * 2);
                this.settled = false;
            }

            update() {
                if (this.settled) return;

                this.vx *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                if (this.y >= this.groundY) {
                    this.y = this.groundY;
                    this.bounces++;
                    if (this.bounces < this.maxBounces && Math.abs(this.vy) > 1.4) {
                        this.vy = -this.vy * 0.35;
                        this.vx *= 0.6;
                    } else {
                        this.settled = true;
                        // Converte para objeto interativo de solo
                        const isSplash = this.isBlood && Math.random() > 0.4;
                        const w = isSplash ? this.size + 2 : this.size;
                        const h = isSplash ? Math.max(2, this.size - 1) : this.size;
                        floorDebris.push(new FloorDebris(this.x, this.y, w, h, this.color, this.isBlood));
                    }
                }
            }

            draw() {
                if (this.settled) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        function triggerViolentExplosion(x, y, isSkeleton) {
            const bloodColors = ["#4a0000", "#7a0404", "#a30808", "#c91818", "#d90429"];
            const boneColors = isSkeleton 
                ? ["#ffffff", "#e5e5e5", "#b8b8b8", "#595959"] 
                : ["#48cae4", "#0096c7", "#023e8a", "#e0fbfc"];

            const bloodCount = 22 + Math.floor(Math.random() * 10);
            for (let i = 0; i < bloodCount; i++) {
                const c = bloodColors[Math.floor(Math.random() * bloodColors.length)];
                activeAirParticles.push(new AirParticle(x, y, c, true));
            }

            const pieceCount = 14 + Math.floor(Math.random() * 8);
            for (let i = 0; i < pieceCount; i++) {
                const c = boneColors[Math.floor(Math.random() * boneColors.length)];
                activeAirParticles.push(new AirParticle(x, y, c, false));
            }
        }

        // Sombra Redonda dos Personagens
        function drawRoundShadow(x, y, baseRadius, bounceFactor = 0) {
            ctx.save();
            const currentR = Math.max(6, baseRadius - bounceFactor * 1.5);
            ctx.translate(x, y + 17);
            
            const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, currentR);
            grad.addColorStop(0, "rgba(0, 0, 0, 0.65)");
            grad.addColorStop(0.6, "rgba(0, 0, 0, 0.35)");
            grad.addColorStop(1, "rgba(0, 0, 0, 0)");

            ctx.beginPath();
            ctx.arc(0, 0, currentR, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
        }

        // Animação Orgânica de Passos
        function drawOrganicSprite(imgOrSheet, isSheet, col, row, gw, gh, drawW, drawH, facingLeft, animTimer, speedMag, hurtTimer) {
            ctx.save();

            if (hurtTimer > 0) {
                const shakeX = (Math.random() - 0.5) * 8;
                const shakeAngle = (Math.random() - 0.5) * 0.3;
                ctx.translate(shakeX, 0);
                ctx.rotate(shakeAngle);
            }

            if (facingLeft) ctx.scale(-1, 1);

            let bobY = 0;
            let swayAngle = 0;
            let scaleY = 1;
            let scaleX = 1;

            if (speedMag > 0.1) {
                bobY = -Math.abs(Math.sin(animTimer)) * 3.5;
                swayAngle = Math.cos(animTimer * 0.5) * 0.09;
                scaleY = 1 + (bobY / 24);
                scaleX = 1 - (bobY / 32);
            }

            ctx.translate(0, bobY);
            ctx.rotate(swayAngle);
            ctx.scale(scaleX, scaleY);

            if (!isSheet) {
                const natW = imgOrSheet.naturalWidth;
                const natH = imgOrSheet.naturalHeight;
                const halfH = natH / 2;

                ctx.drawImage(imgOrSheet, 0, halfH, natW, halfH, -drawW / 2, 0, drawW, drawH / 2);
                const extraHeadDip = speedMag > 0.1 ? Math.sin(animTimer) * 0.8 : 0;
                ctx.drawImage(imgOrSheet, 0, 0, natW, halfH, -drawW / 2, -drawH / 2 + extraHeadDip, drawW, drawH / 2);
            } else {
                const halfH = gh / 2;
                const sx = col * gw;
                const sy = row * gh;

                ctx.drawImage(imgOrSheet, sx, sy + halfH, gw, halfH, -drawW / 2, 0, drawW, drawH / 2);
                const extraHeadDip = speedMag > 0.1 ? Math.sin(animTimer) * 0.8 : 0;
                ctx.drawImage(imgOrSheet, sx, sy, gw, halfH, -drawW / 2, -drawH / 2 + extraHeadDip, drawW, drawH / 2);
            }

            if (hurtTimer > 0) {
                ctx.globalCompositeOperation = "source-atop";
                ctx.fillStyle = `rgba(255, 30, 30, ${Math.min(0.85, hurtTimer / 25)})`;
                ctx.fillRect(-drawW * 1.5, -drawH * 1.5, drawW * 3, drawH * 3);
            }

            ctx.restore();
        }

        // Classe Jogador
        class Player {
            constructor(x, y, color, controls, imgRef, name) {
                this.x = x;
                this.y = y;
                this.hitRadius = 16;
                this.color = color;
                this.controls = controls;
                this.img = imgRef;
                this.name = name;
                this.vx = 0;
                this.vy = 0;
                this.speed = 4.2;
                this.lives = 3;
                this.invulnerableTimer = 0;
                this.hurtTimer = 0;
                this.facingLeft = false;
                this.animTimer = 0;
            }

            update() {
                if (this.invulnerableTimer > 0) this.invulnerableTimer--;
                if (this.hurtTimer > 0) this.hurtTimer--;

                let moveX = 0;
                let moveY = 0;
                if (keys[this.controls[0]]) moveY -= 1;
                if (keys[this.controls[1]]) moveY += 1;
                if (keys[this.controls[2]]) { moveX -= 1; this.facingLeft = true; }
                if (keys[this.controls[3]]) { moveX += 1; this.facingLeft = false; }

                if (moveX !== 0 && moveY !== 0) {
                    moveX *= 0.7071;
                    moveY *= 0.7071;
                }

                this.vx = this.vx * 0.76 + moveX * this.speed * 0.24;
                this.vy = this.vy * 0.76 + moveY * this.speed * 0.24;

                this.x += this.vx;
                this.y += this.vy;

                const speedMag = Math.hypot(this.vx, this.vy);
                if (speedMag > 0.15) {
                    this.animTimer += speedMag * 0.085;
                } else {
                    this.animTimer *= 0.75;
                }

                const minX = 140, maxX = canvas.width - 140;
                const minY = 100, maxY = canvas.height - 100;

                if (this.x - this.hitRadius < minX) this.x = minX + this.hitRadius;
                if (this.x + this.hitRadius > maxX) this.x = maxX - this.hitRadius;
                if (this.y - this.hitRadius < minY) this.y = minY + this.hitRadius;
                if (this.y + this.hitRadius > maxY) this.y = maxY - this.hitRadius;
            }

            draw() {
                const speedMag = Math.hypot(this.vx, this.vy);
                const bounce = speedMag > 0.15 ? Math.abs(Math.sin(this.animTimer)) : 0;
                drawRoundShadow(this.x, this.y, 14, bounce);

                ctx.save();
                if (this.invulnerableTimer % 6 >= 3 && this.hurtTimer === 0) {
                    ctx.globalAlpha = 0.4;
                }

                const isReady = (this.img === imgP1 && imgP1Loaded) || (this.img === imgP2 && imgP2Loaded);

                if (isReady) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    drawOrganicSprite(
                        this.img, false, 0, 0, 0, 0,
                        36, 46,
                        this.facingLeft,
                        this.animTimer,
                        speedMag,
                        this.hurtTimer
                    );
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.hitRadius, 0, Math.PI * 2);
                    ctx.fillStyle = this.hurtTimer > 0 ? "#ff2222" : this.color;
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // Classe Inimigo
        class Enemy {
            constructor(x, y, spriteCol, spriteRow, isSkeleton) {
                this.x = x;
                this.y = y;
                this.size = 36;
                this.hitRadius = 18;
                this.spriteCol = spriteCol;
                this.spriteRow = spriteRow;
                this.isSkeleton = isSkeleton;
                this.speed = 1.9 + Math.min(1.7, floor * 0.15);
                this.vx = 0;
                this.vy = 0;
                this.facingLeft = false;
                this.animTimer = Math.random() * Math.PI * 2;
            }

            update(p1, p2) {
                const d1 = Math.hypot(p1.x - this.x, p1.y - this.y);
                const d2 = Math.hypot(p2.x - this.x, p2.y - this.y);
                const target = d1 < d2 ? p1 : p2;

                const angle = Math.atan2(target.y - this.y, target.x - this.x);
                this.vx = this.vx * 0.85 + Math.cos(angle) * this.speed * 0.15;
                this.vy = this.vy * 0.85 + Math.sin(angle) * this.speed * 0.15;

                this.facingLeft = this.vx < 0;
                this.x += this.vx;
                this.y += this.vy;

                const speedMag = Math.hypot(this.vx, this.vy);
                this.animTimer += speedMag * 0.085;

                [p1, p2].forEach(p => {
                    const dist = Math.hypot(p.x - this.x, p.y - this.y);
                    const touchDistance = p.hitRadius + this.hitRadius + 2;

                    if (dist < touchDistance) {
                        if (p.invulnerableTimer === 0) {
                            p.lives--;
                            p.invulnerableTimer = 65;
                            p.hurtTimer = 30;
                            screenShake = 14;

                            const pushAngle = Math.atan2(p.y - this.y, p.x - this.x);
                            p.vx += Math.cos(pushAngle) * 16;
                            p.vy += Math.sin(pushAngle) * 16;
                        }
                    }
                });
            }

            draw() {
                const speedMag = Math.hypot(this.vx, this.vy);
                const bounce = speedMag > 0.15 ? Math.abs(Math.sin(this.animTimer)) : 0;
                drawRoundShadow(this.x, this.y, 14, bounce);

                if (enemySheetLoaded) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    drawOrganicSprite(
                        enemySheet, true, this.spriteCol, this.spriteRow,
                        enemyGridW, enemyGridH,
                        44, 44,
                        this.facingLeft,
                        this.animTimer,
                        speedMag,
                        0
                    );
                    ctx.restore();
                } else {
                    const half = this.size / 2;
                    ctx.fillStyle = "#e53170";
                    ctx.fillRect(this.x - half, this.y - half, this.size, this.size);
                }
            }
        }

        let p1, p2;
        let enemies = [];
        let boxes = [];
        let trapdoor = { x: 0, y: 0, size: 54, open: false };

        function initLevel(resetAll = false) {
            if (resetAll) {
                floor = 1;
                floorDebris = [];
                p1 = new Player(470, 360, "#ffd166", ["w", "s", "a", "d"], imgP1, "Amarelo");
                p2 = new Player(530, 360, "#6bb4db", ["arrowup", "arrowdown", "arrowleft", "arrowright"], imgP2, "Azul");
            } else {
                p1.x = 470; p1.y = 360; p1.vx = 0; p1.vy = 0;
                p2.x = 530; p2.y = 360; p2.vx = 0; p2.vy = 0;
                floorDebris = [];
            }
            gameOver = false;
            activeAirParticles = [];

            boxes = [];
            const boxCount = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < boxCount; i++) {
                boxes.push({
                    x: 520 + (Math.random() - 0.5) * 360,
                    y: 360 + (Math.random() - 0.5) * 260,
                    w: 48,
                    h: 48
                });
            }

            enemies = [];
            const count = 4 + floor * 2;
            for (let i = 0; i < count; i++) {
                const isSkeleton = Math.random() > 0.5;
                const col = isSkeleton ? 4 : 1;
                
                const angle = (i / count) * Math.PI * 2;
                const radius = 280 + Math.random() * 120;
                const ex = 640 + Math.cos(angle) * radius;
                const ey = 360 + Math.sin(angle) * radius;

                enemies.push(new Enemy(ex, ey, col, 1, isSkeleton));
            }

            trapdoor.x = 880;
            trapdoor.y = 360;
            trapdoor.open = false;

            updateHud();
        }

        function updateChainPhysics() {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);

            const maxRestDistance = 145;
            if (dist > maxRestDistance) {
                const diff = dist - maxRestDistance;
                const force = diff * 0.045;
                const fx = (dx / dist) * force;
                const fy = (dy / dist) * force;

                p1.vx += fx;
                p1.vy += fy;
                p2.vx -= fx;
                p2.vy -= fy;
            }
        }

        function resolveBoxCollisions(entity) {
            boxes.forEach(b => {
                const nearestX = Math.max(b.x, Math.min(entity.x, b.x + b.w));
                const nearestY = Math.max(b.y, Math.min(entity.y, b.y + b.h));
                const distX = entity.x - nearestX;
                const distY = entity.y - nearestY;
                const dist = Math.hypot(distX, distY);
                const r = entity.hitRadius || (entity.size ? entity.size / 2.3 : 16);

                if (dist < r) {
                    const overlap = r - dist;
                    if (dist === 0) {
                        entity.x += overlap;
                    } else {
                        entity.x += (distX / dist) * overlap;
                        entity.y += (distY / dist) * overlap;
                    }
                }
            });
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
        }

        function handleWeaponInteraction() {
            sawRotationAngle += 0.2;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const d = distToSegment(enemy.x, enemy.y, p1.x, p1.y, p2.x, p2.y);
                const hitThreshold = currentWeapon === "laser" ? 22 : 30;

                if (d < hitThreshold + enemy.hitRadius) {
                    triggerViolentExplosion(enemy.x, enemy.y, enemy.isSkeleton);
                    enemies.splice(i, 1);
                    screenShake = Math.max(screenShake, 7);
                }
            }

            if (enemies.length === 0) {
                trapdoor.open = true;
            }
        }

        function drawWeapon() {
            if (currentWeapon === "laser") {
                ctx.save();
                ctx.lineWidth = 12;
                ctx.strokeStyle = "rgba(0, 235, 199, 0.4)";
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

                ctx.lineWidth = 4;
                ctx.strokeStyle = "#ffffff";
                ctx.shadowColor = "#00ebc7";
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                ctx.restore();
            } else if (currentWeapon === "saw") {
                const numSaws = 5;
                ctx.save();
                ctx.strokeStyle = "#8d99ae";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

                for (let i = 1; i <= numSaws; i++) {
                    const t = i / (numSaws + 1);
                    const sx = p1.x + (p2.x - p1.x) * t;
                    const sy = p1.y + (p2.y - p1.y) * t;
                    const radius = (i % 2 === 0) ? 14 : 11;

                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(sawRotationAngle * (i % 2 === 0 ? 1 : -1));

                    ctx.fillStyle = "#ff5470";
                    ctx.beginPath();
                    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                        ctx.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
                        ctx.lineTo(Math.cos(a + 0.3) * (radius * 0.5), Math.sin(a + 0.3) * (radius * 0.5));
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.restore();
                }
                ctx.restore();
            }
        }

        function drawDungeon() {
            ctx.fillStyle = "#15141f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#1e1d2d";
            ctx.lineWidth = 2;
            for (let x = 120; x < canvas.width - 120; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 80);
                ctx.lineTo(x, canvas.height - 80);
                ctx.stroke();
            }
            for (let y = 80; y < canvas.height - 80; y += 40) {
                ctx.beginPath();
                ctx.moveTo(120, y);
                ctx.lineTo(canvas.width - 120, y);
                ctx.stroke();
            }

            // Desenha detritos no chão (abaixo dos personagens)
            for (let i = 0; i < floorDebris.length; i++) {
                floorDebris[i].draw();
            }

            // Paredes
            ctx.fillStyle = "#0a0910";
            ctx.fillRect(0, 0, canvas.width, 80);
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            ctx.fillRect(0, 0, 120, canvas.height);
            ctx.fillRect(canvas.width - 120, 0, 120, canvas.height);

            ctx.strokeStyle = "#2d2a3e";
            ctx.lineWidth = 4;
            ctx.strokeRect(120, 80, canvas.width - 240, canvas.height - 160);

            boxes.forEach(b => {
                drawRoundShadow(b.x + b.w / 2, b.y + b.h / 2, 22, 0);

                ctx.fillStyle = "#4a3c2c";
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = "#282016";
                ctx.lineWidth = 3;
                ctx.strokeRect(b.x, b.y, b.w, b.h);

                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x + b.w, b.y + b.h);
                ctx.moveTo(b.x + b.w, b.y);
                ctx.lineTo(b.x, b.y + b.h);
                ctx.stroke();
            });

            ctx.save();
            ctx.translate(trapdoor.x, trapdoor.y);
            ctx.fillStyle = trapdoor.open ? "#000" : "#2e2118";
            ctx.fillRect(-trapdoor.size / 2, -trapdoor.size / 2, trapdoor.size, trapdoor.size);
            ctx.strokeStyle = trapdoor.open ? "#00ebc7" : "#553b2a";
            ctx.lineWidth = 3;
            ctx.strokeRect(-trapdoor.size / 2, -trapdoor.size / 2, trapdoor.size, trapdoor.size);

            ctx.fillStyle = trapdoor.open ? "#00ebc7" : "#a7a9be";
            ctx.font = "bold 11px monospace";
            ctx.fillText(trapdoor.open ? "ABERTO" : "FECHADO", -23, 4);
            ctx.restore();
        }

        function updateHud() {
            hudFloor.innerText = `CALABOUÇO: ANDAR ${floor}`;
            hudP1.innerText = `P1 (Amarelo): ${"❤️".repeat(Math.max(0, p1.lives))}`;
            hudP2.innerText = `P2 (Azul): ${"❤️".repeat(Math.max(0, p2.lives))}`;
        }

        function gameLoop() {
            if (!gameOver) {
                p1.update();
                p2.update();

                updateChainPhysics();

                resolveBoxCollisions(p1);
                resolveBoxCollisions(p2);

                enemies.forEach(e => {
                    e.update(p1, p2);
                    resolveBoxCollisions(e);
                });

                handleWeaponInteraction();

                // Atualiza detritos no solo (chutados e espalhados pelos players)
                const players = [p1, p2];
                for (let i = 0; i < floorDebris.length; i++) {
                    floorDebris[i].update(players);
                }

                // Atualiza partículas no ar
                for (let i = activeAirParticles.length - 1; i >= 0; i--) {
                    activeAirParticles[i].update();
                    if (activeAirParticles[i].settled) {
                        activeAirParticles.splice(i, 1);
                    }
                }

                if (p1.lives <= 0 || p2.lives <= 0) {
                    gameOver = true;
                }

                if (trapdoor.open) {
                    const d1 = Math.hypot(p1.x - trapdoor.x, p1.y - trapdoor.y);
                    const d2 = Math.hypot(p2.x - trapdoor.x, p2.y - trapdoor.y);
                    if (d1 < 36 && d2 < 36) {
                        floor++;
                        initLevel(false);
                    }
                }

                updateHud();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake *= 0.88;
                if (screenShake < 0.3) screenShake = 0;
            }

            const zoom = 1.50;
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            drawDungeon();
            drawWeapon();
            p1.draw();
            p2.draw();
            enemies.forEach(e => e.draw());
            activeAirParticles.forEach(p => p.draw());

            ctx.restore();

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e53170";
                ctx.font = "bold 44px monospace";
                ctx.textAlign = "center";
                ctx.fillText("FIM DE JOGO!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#fffffe";
                ctx.font = "20px monospace";
                ctx.fillText(`Vocês sobreviveram até o Andar ${floor}`, canvas.width / 2, canvas.height / 2 + 25);
                ctx.fillText("Pressione 'REINICIAR' para tentar novamente", canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = "start";
            }

            requestAnimationFrame(gameLoop);
        }

        btnWeapon.addEventListener("click", () => {
            if (currentWeapon === "laser") {
                currentWeapon = "saw";
                btnWeapon.innerText = "ARMA: SERRAS";
                btnWeapon.style.background = "#ff5470";
            } else {
                currentWeapon = "laser";
                btnWeapon.innerText = "ARMA: LASER";
                btnWeapon.style.background = "#e53170";
            }
        });

        btnRestart.addEventListener("click", () => {
            initLevel(true);
        });

        initLevel(true);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
